<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Validations Enseignants | Acadynote Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f5f9; padding: 40px; color: #1e293b; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h1 { font-size: 20px; font-weight: 800; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; padding: 12px; border-bottom: 2px solid #f1f5f9; color: #64748b; font-size: 13px; text-transform: uppercase; }
        td { padding: 15px 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        .btn { padding: 8px 15px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: 600; transition: 0.3s; display: inline-block; }
        .btn-valider { background: #dcfce7; color: #16a34a; margin-right: 5px; }
        .btn-valider:hover { background: #16a34a; color: white; }
        .btn-refuser { background: #fef2f2; color: #dc2626; }
        .btn-refuser:hover { background: #dc2626; color: white; }
        .btn-back { color: #64748b; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1><i class="fas fa-users-cog"></i> Demandes d'adhésion</h1>
        <a href="{% url 'accueil' %}" class="btn-back"><i class="fas fa-arrow-left"></i> Retour</a>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div style="padding: 15px; margin-bottom: 20px; border-radius: 10px; background: #eff6ff; color: #1d4ed8; font-size: 14px;">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <table>
        <thead>
            <tr>
                <th>Nom de l'enseignant</th>
                <th>Email</th>
                <th style="text-align: right;">Décision</th>
            </tr>
        </thead>
        <tbody>
            {% for e in enseignants_en_attente %}
            <tr>
                <td><strong>{{ e.nom }} {{ e.prenoms }}</strong></td>
                <td>{{ e.email }}</td>
                <td style="text-align: right;">
                    <a href="{% url 'valider_enseignant' e.pk %}" class="btn btn-valider">
                        <i class="fas fa-check"></i> Accepter
                    </a>
                    <a href="{% url 'refuser_enseignant' e.pk %}" class="btn btn-refuser" onclick="return confirm('Êtes-vous sûr de vouloir refuser ce professeur ?')">
                        <i class="fas fa-times"></i> Refuser
                    </a>
                </td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="3" style="text-align: center; padding: 40px; color: #94a3b8;">
                    <i class="fas fa-check-double fa-2x" style="display: block; margin-bottom: 10px;"></i>
                    Aucune demande en attente.
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>

</body>
</html>
