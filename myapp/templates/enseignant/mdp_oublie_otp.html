<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification | Le Trésor de Dowa</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #4A90E2;
            --secondary: #50E3C2;
            --dark: #1e293b;
            --glass: rgba(255, 255, 255, 0.9);
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top left, #4A90E2, #50E3C2);
            height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Effet de bulles en arrière-plan */
        body::before, body::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            z-index: -1;
        }
        body::before { top: -100px; left: -100px; }
        body::after { bottom: -100px; right: -100px; }

        .container {
            background: var(--glass);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .icon-circle {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 28px;
            box-shadow: 0 10px 20px rgba(74, 144, 226, 0.3);
        }

        h1 {
            color: var(--dark);
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        p.description {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 30px;
        }

        /* Style des messages Django */
        .messages {
            list-style: none;
            padding: 0;
            margin-bottom: 20px;
        }
        .error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 13px; }
        .success { color: #10b981; background: #d1fae5; padding: 10px; border-radius: 8px; font-size: 13px; }

        .otp-input-wrapper {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }

        input {
            width: 100%;
            padding: 15px;
            border-radius: 12px;
            border: 2px solid #e2e8f0;
            font-size: 24px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 8px;
            transition: all 0.3s;
            color: var(--dark);
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(74, 144, 226, 0.1);
            outline: none;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary), #357ABD);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 15px rgba(74, 144, 226, 0.4);
        }

        .resend {
            margin-top: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        .resend a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="icon-circle">
        <i class="fas fa-key"></i>
    </div>

    <h1>Vérification</h1>
    <p class="description">Nous avons envoyé un code de sécurité à votre adresse email pour valider votre identité.</p>

    {% if messages %}
    <div class="messages">
        {% for message in messages %}
            <div class="{{ message.tags }} animated shake">
                <i class="fas fa-exclamation-circle me-1"></i> {{ message }}
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="text" 
               name="otp" 
               maxlength="6" 
               placeholder="······" 
               required 
               autofocus 
               autocomplete="off"
               oninput="this.value = this.value.replace(/[^0-9]/g, '')">
        
        <button type="submit">
            Vérifier le code <i class="fas fa-arrow-right"></i>
        </button>
    </form>

    <div class="resend">
        Vous n'avez pas reçu de code ? <br>
        <a href="{% url 'register_enseignant' %}">Réessayer l'inscription</a>
    </div>
</div>

</body>
</html>
