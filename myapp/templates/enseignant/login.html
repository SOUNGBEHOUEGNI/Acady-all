<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Enseignant | Acadynote</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1e40af;
            --accent: #10b981;
            --bg-gradient: linear-gradient(135deg, #1e293b 0%, #334155 100%);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-gradient); 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            color: #1e293b;
        }

        .login-card { 
            background: #ffffff; 
            padding: 40px; 
            border-radius: 24px; 
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2), 0 10px 10px -5px rgba(0, 0, 0, 0.1); 
            width: 100%; 
            max-width: 420px; 
            transition: transform 0.3s ease;
        }

        .header-area { text-align: center; margin-bottom: 30px; }
        .logo-circle {
            width: 60px; height: 60px; background: var(--primary);
            color: white; border-radius: 16px; display: flex;
            align-items: center; justify-content: center;
            margin: 0 auto 15px; font-size: 24px;
            box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.4);
        }

        h1 { font-size: 24px; font-weight: 800; color: #0f172a; letter-spacing: -0.5px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-top: 5px; }

        .form-group { position: relative; margin-bottom: 20px; }
        .form-group i {
            position: absolute; left: 15px; top: 40px;
            color: #94a3b8; font-size: 18px;
        }

        label { font-weight: 600; font-size: 13px; color: #475569; margin-left: 2px; }
        
        input { 
            width: 100%; padding: 12px 12px 12px 45px; margin-top: 6px; 
            border: 2px solid #f1f5f9; border-radius: 12px; font-size: 15px; 
            background: #f8fafc; transition: all 0.3s ease; 
        }
        
        input:focus { 
            outline: none; border-color: var(--primary); 
            background: #fff; box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1); 
        }

        button { 
            width: 100%; padding: 14px; margin-top: 10px; 
            background-color: var(--primary); border: none; 
            border-radius: 12px; color: white; font-size: 16px; font-weight: 700; 
            cursor: pointer; transition: all 0.3s ease; 
        }
        
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }

        .footer-links { text-align: center; margin-top: 25px; border-top: 1px solid #f1f5f9; padding-top: 20px; }
        .footer-links a { color: var(--primary); text-decoration: none; font-size: 14px; font-weight: 600; }
        .footer-links a:hover { text-decoration: underline; }

        .message { 
            padding: 12px; border-radius: 10px; font-size: 13px; 
            margin-bottom: 20px; text-align: center; list-style: none;
        }
        .error { background: #fef2f2; color: #b91c1c; border: 1px solid #fee2e2; }
        .success { background: #f0fdf4; color: #16a34a; border: 1px solid #dcfce7; }

        @media (max-width: 480px) { .login-card { padding: 30px 20px; border-radius: 0; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; } }
    </style>
</head>
<body>

<div class="login-card">
    <div class="header-area">
        <div class="logo-circle">
            <i class="fas fa-chalkboard-teacher"></i>
        </div>
        <h1>Espace Enseignant</h1>
        <p class="subtitle">Heureux de vous revoir sur Acadynote</p>
    </div>

    {% if messages %}
        {% for message in messages %}
            <div class="message {{ message.tags }}">
                <i class="fas {% if message.tags == 'error' %}fa-exclamation-circle{% else %}fa-check-circle{% endif %} me-2"></i>
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post" action="{% url 'enseignant_login' %}">
        {% csrf_token %}
        <div class="form-group">
            <label>Adresse Email</label>
            <i class="fas fa-envelope"></i>
            <input type="email" name="email" placeholder="nom@ecole.com" required>
        </div>

        <div class="form-group">
            <label>Mot de passe</label>
            <i class="fas fa-lock"></i>
            <input type="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit">
            Se connecter <i class="fas fa-arrow-right ms-2" style="font-size: 14px;"></i>
        </button>
    </form>

    <div class="footer-links">
        <p style="color: #64748b; font-size: 14px; margin-bottom: 8px;">
            Pas encore de compte ? <a href="{% url 'register_enseignant' %}">S'inscrire</a>
        </p>
        <a href="{% url 'enseignant_mdp_oublie' %}" style="color: #94a3b8; font-weight: 400; font-size: 13px;">
            Mot de passe oublié ?
        </a>
    </div>
</div>

</body>
</html>
