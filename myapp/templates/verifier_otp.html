<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vérification OTP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
            font-family: 'Segoe UI', sans-serif; margin: 0;
        }

        .otp-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 2.5rem; border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            max-width: 450px; width: 90%; text-align: center;
        }

        .icon-box {
            width: 80px; height: 80px; background: #dbeafe; color: #2563eb;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; margin: 0 auto 1.5rem; font-size: 2rem;
        }

        .form-control-otp {
            letter-spacing: 12px; /* Espacement stylé */
            font-size: 2.2rem;
            font-weight: bold;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 0.8rem 5px 0.8rem 17px; /* On compense le letter-spacing pour centrer */
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box; /* Évite le débordement */
            color: #1e3a8a;
        }

        .form-control-otp:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
            outline: none;
        }

        .btn-verify {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none; padding: 0.8rem; border-radius: 12px;
            font-weight: 600; width: 100%; margin-top: 1.5rem; color: white;
        }

        .alert { border-radius: 10px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="otp-card">
        <div class="icon-box"><i class="fas fa-shield-alt"></i></div>
        <h2>Vérification</h2>
        <p>Entrez le code envoyé à votre email.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <input type="text" name="otp" class="form-control-otp" 
                       placeholder="000000" maxlength="6" pattern="\d{6}" required 
                       oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            </div>
            <button type="submit" class="btn btn-verify">Confirmer</button>
        </form>
    </div>

</body>
</html>
